services:
  postgres:
    image: postgres:17
    container_name: clastle_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clastle_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: clastle_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - ${PGADMIN_PORT}:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - clastle_network
    depends_on:
      - postgres

  redis:
    image: redis:8
    container_name: clastle_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - clastle_network
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clastle_api
    ports:
      - "${API_PORT}:3001"
    env_file:
      - ./apps/api/.env
    networks:
      - clastle_network
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: clastle_web
    ports:
      - "${WEB_PORT}:3000"
    env_file:
      - ./apps/web/.env
    networks:
      - clastle_network
    depends_on:
      - api

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  clastle_network:
    driver: bridge
services:
  postgres:
    image: postgres:17
    container_name: clastle-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clastle-network

  redis:
    image: redis:8
    container_name: clastle-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - clastle-network

volumes:
  postgres_data:
  redis_data:

networks:
  clastle-network:
    driver: bridge